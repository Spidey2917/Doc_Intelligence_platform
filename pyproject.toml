[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.0.1"
description = "Document intelligence platform for retail recovery audit: decomposition, census, extraction, landing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
  "pypdf>=5.0",
  "openpyxl>=3.1",
  "pyxlsb>=1.0.10",
  "extract-msg>=0.50",
  "olefile>=0.46",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Phase 1+ parsing tier. Heavy (pulls torch); not needed for the census.
parse = ["docling>=2.0"]

[project.scripts]
docintel = "docintel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
